<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#FAF7F2;font-family:Georgia,serif;color:#383431">
    <div style="max-width:480px;margin:0 auto;padding:40px 24px;text-align:center">
      <p style="font-size:40px;color:#B97988;margin:0;font-style:italic">Maya</p>
      <h1 style="font-weight:normal;font-size:26px">Seu link de acesso</h1>
      <p style="font-family:Arial,sans-serif;font-size:15px;color:#776C67;line-height:1.6">
        Toque no botão abaixo para entrar no Maya Memories. O link vale por pouco tempo e só pode ser usado uma vez.
      </p>
      <p style="margin:32px 0">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
           style="background:#383431;color:#FFFDF9;text-decoration:none;padding:14px 28px;border-radius:999px;font-family:Arial,sans-serif;font-size:15px">
          Entrar
        </a>
      </p>
      <p style="font-family:Arial,sans-serif;font-size:12px;color:#776C67">Se você não pediu este link, ignore este e-mail.</p>
    </div>
  </body>
</html>
