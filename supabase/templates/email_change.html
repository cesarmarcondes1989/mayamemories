<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#FDF3F4;font-family:Georgia,serif;color:#4A3B40">
    <div style="max-width:480px;margin:0 auto;padding:40px 24px;text-align:center">
      <p style="font-size:40px;color:#D97A92;margin:0">♡</p>
      <h1 style="font-weight:normal;font-size:26px">Confirme seu e-mail</h1>
      <p style="font-family:Arial,sans-serif;font-size:15px;color:#8A7178;line-height:1.6">
        Você deixou este e-mail no baú de memórias. Toque no botão para confirmar — assim você consegue entrar por
        qualquer celular e recebe os avisos importantes.
      </p>
      <p style="margin:32px 0">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/inicio?email=confirmado"
           style="background:#D97A92;color:#FFFAFA;text-decoration:none;padding:14px 28px;border-radius:999px;font-family:Arial,sans-serif;font-size:15px">
          Confirmar e-mail
        </a>
      </p>
      <p style="font-family:Arial,sans-serif;font-size:12px;color:#8A7178">Se não foi você, ignore este e-mail — nada muda.</p>
    </div>
  </body>
</html>
