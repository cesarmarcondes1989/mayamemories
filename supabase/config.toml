# Configuração do Supabase CLI (desenvolvimento local e referência para produção).
# Em produção, replique os itens de [auth] no painel: Authentication → Settings / Emails.
project_id = "maya-memories"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
file_size_limit = "500MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Cadastro público DESLIGADO: contas só nascem por convite (Admin API).
enable_signup = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "60s"
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Seu link de acesso ao Maya Memories"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "Você faz parte da história da Maya"
content_path = "./supabase/templates/invite.html"
