<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Guardei pra você — Reel "Quando você crescer"</title>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="../palettes.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { background: radial-gradient(120% 80% at 50% 10%, color-mix(in srgb, var(--cream) 60%, var(--paper)) 0%, var(--cream) 55%, color-mix(in srgb, var(--rose-soft) 70%, var(--rose)) 100%); color: var(--ink); font-family: Nunito, sans-serif; position: relative; }
  .abs { position: absolute; left: 0; right: 0; text-align: center; }
  .display { font-family: "Amatic SC", cursive; font-weight: 700; line-height: .95; }
  .hand { font-family: Caveat, cursive; }
  .scene { position: absolute; inset: 0; display: none; }
  .grain { position:absolute; inset:0; opacity:.4; background-image: radial-gradient(color-mix(in srgb, var(--rose-deep) 8%, transparent) 1px, transparent 1px); background-size: 6px 6px; }
  .w { display: inline-block; }
  .rose { color: var(--rose-deep); }

  #a1 { top: 640px; font-size: 170px; padding: 0 80px; }
  #a2 { top: 1060px; font-size: 110px; padding: 0 80px; color: var(--rose-deep); }

  #b-title { top: 250px; font-size: 120px; padding: 0 80px; }
  .pol { position: absolute; width: 470px; padding: 26px 26px 0; background: #fff; box-shadow: 0 30px 60px color-mix(in srgb, var(--ink) 22%, transparent); }
  .pol .ph { width: 100%; height: 470px; overflow: hidden; background: var(--rose-soft); }
  .pol img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%; display:block; }
  .pol p { font-family: Caveat, cursive; font-size: 50px; text-align: center; padding: 18px 0 22px; }
  #c-title { top: 760px; font-size: 140px; padding: 0 90px; }

  #letter { position:absolute; left: 130px; right: 130px; top: 640px; padding: 80px 70px 100px; background: var(--paper); border-radius: 26px; box-shadow: 0 40px 80px color-mix(in srgb, var(--ink) 20%, transparent); }
  #letter p { font-family: Caveat, cursive; font-size: 64px; line-height: 1.25; min-height: 280px; }
  #seal { position:absolute; left: 50%; bottom: -70px; width: 170px; height: 170px; margin-left: -85px; border-radius: 50%; background: var(--rose-deep); display:grid; place-items:center; box-shadow: 0 16px 30px color-mix(in srgb, var(--rose-deep) 45%, transparent); color: #fff; font-weight: 900; font-size: 30px; text-align:center; line-height: 1.05; }
  #d-title { top: 260px; font-size: 130px; padding: 0 80px; }

  #e-heart { position:absolute; left: 50%; top: 520px; width: 230px; margin-left: -115px; }
  #e-word { top: 800px; font-size: 180px; color: var(--rose-deep); }
  #e-cta { top: 1040px; font-size: 54px; font-weight: 800; }
  #e-pill { position:absolute; left: 50%; top: 1150px; padding: 26px 60px; border-radius: 80px; background: var(--rose-deep); color:#fff; font-size: 60px; font-weight: 900; white-space: nowrap; box-shadow: 0 20px 40px color-mix(in srgb, var(--rose-deep) 40%, transparent); }
  #e-small { top: 1330px; font-size: 38px; color: var(--taupe); font-weight: 700; }
</style>
<script src="engine.js"></script>
</head>
<body>
<div class="grain"></div>

<section class="scene" id="A">
  <div class="abs display" id="a1"></div>
  <div class="abs display" id="a2"></div>
</section>

<section class="scene" id="B">
  <div class="abs display" id="b-title">O que você vai ter pra mostrar?</div>
  <div class="pol" id="p1" style="left:70px;top:560px"><div class="ph"><img src="../../public/demo/vo.jpg"></div><p>a voz da vó cantando</p></div>
  <div class="pol" id="p2" style="left:540px;top:820px"><div class="ph"><img src="../../public/demo/sorriso.jpg"></div><p>a primeira palavra</p></div>
  <div class="pol" id="p3" style="left:110px;top:1140px"><div class="ph"><img src="../../public/demo/nascimento.jpg"></div><p>o dia em que você chegou</p></div>
</section>

<section class="scene" id="C">
  <div class="abs display" id="c-title">Hoje, tudo isso se perde <span class="rose">num celular</span>.</div>
</section>

<section class="scene" id="D">
  <div class="abs display" id="d-title">Guarda hoje.<br><span class="rose">Ela abre quando crescer.</span></div>
  <div id="letter"><p id="letter-text"></p><div id="seal">abrir<br>aos 18</div></div>
</section>

<section class="scene" id="E">
  <svg id="e-heart" viewBox="0 0 48 44" fill="none"><path id="hpath" d="M24 40C14 33 5 26 4.5 16.5 4.2 10 8.8 5 14.6 5c4.3 0 7.4 2.6 9.4 6.2C26 7.6 29.1 5 33.4 5 39.2 5 43.8 10 43.5 16.5 43 26 34 33 24 40Z" style="stroke:var(--rose-deep)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="140" stroke-dashoffset="140"/></svg>
  <div class="abs display" id="e-word">guardei pra você</div>
  <div class="abs" id="e-cta">Crie o baú da sua família, grátis</div>
  <div id="e-pill">link na bio ♡</div>
  <div class="abs" id="e-small">privado · sem anúncios · só a família vê</div>
</section>

<script>
const DURATION = 22;
const LETTER = "Filha, hoje você dormiu no meu colo ouvindo a vó cantar. Quando ler isto, quero que saiba: a gente estava lá.";

// palavras que entram uma a uma
function words(el, text) {
  el.innerHTML = text.split(" ").map((w) => `<span class="w">${w}</span>`).join(" ");
  return [...el.querySelectorAll(".w")];
}
const A1 = words(A.$("#a1"), "Um dia ela vai ter 18 anos.");
const A2 = words(A.$("#a2"), "E vai perguntar: como foi?");

function scene(id, t, a, b) {
  const el = A.$(id);
  const on = t >= a && t <= b;
  el.style.display = on ? "block" : "none";
  return on;
}
function pop(list, t, start, gap) {
  list.forEach((w, i) => {
    const k = A.back(A.p(t, start + i * gap, start + i * gap + 0.45));
    A.set(w, { o: A.clamp(A.out(A.p(t, start + i * gap, start + i * gap + 0.25))), y: 50 * (1 - k), s: 0.7 + 0.3 * k });
  });
}

window.render = function (t) {
  // A — gancho (0–4.4)
  if (scene("#A", t, 0, 4.4)) {
    const out = 1 - A.p(t, 4.0, 4.4);
    A.$("#A").style.opacity = out;
    pop(A1, t, 0.15, 0.17);
    pop(A2, t, 1.8, 0.2);
  }
  // B — o que você vai ter pra mostrar (4.4–10.4)
  if (scene("#B", t, 4.4, 10.4)) {
    A.set("#b-title", { o: A.life(t, 4.5, 10.3, 0.45), y: 30 * (1 - A.out(A.p(t, 4.5, 5))) });
    [["#p1", -6], ["#p2", 5], ["#p3", -3]].forEach(([id, rot], i) => {
      const st = 5.2 + i * 1.2;
      const k = A.back(A.p(t, st, st + 0.8));
      const fall = A.inOut(A.p(t, 9.4 + i * 0.12, 10.4));
      A.set(id, { o: A.clamp(k * 3) * (1 - fall), y: -1400 * (1 - k) + 900 * fall, r: rot * k + (1 - k) * 25 + (i % 2 ? 30 : -30) * fall, s: 1 - 0.1 * fall });
    });
  }
  // C — tudo se perde (10.4–13.6)
  if (scene("#C", t, 10.4, 13.6)) {
    const k = A.out(A.p(t, 10.5, 11.1));
    A.set("#c-title", { o: k * (1 - A.p(t, 13.2, 13.6)), y: 40 * (1 - k), s: 1 + 0.04 * A.p(t, 10.5, 13.6) });
  }
  // D — a carta (13.6–18.6)
  if (scene("#D", t, 13.6, 18.6)) {
    const out = 1 - A.p(t, 18.2, 18.6);
    A.set("#d-title", { o: A.out(A.p(t, 13.7, 14.2)) * out, y: 30 * (1 - A.out(A.p(t, 13.7, 14.2))) });
    const lt = A.out(A.p(t, 14.0, 14.7));
    A.set("#letter", { o: lt * out, y: 220 * (1 - lt), r: -1.5 });
    A.type("#letter-text", LETTER, A.p(t, 14.6, 17.4));
    const seal = A.back(A.p(t, 17.3, 17.9));
    A.set("#seal", { o: A.clamp(seal * 2), s: Math.max(0.01, 0.4 + 0.6 * seal) * (1 + 0.6 * (1 - A.clamp(seal * 2))), r: -12 });
  }
  // E — marca (18.6–22)
  if (scene("#E", t, 18.6, 22)) {
    A.$("#hpath").setAttribute("stroke-dashoffset", 140 * (1 - A.inOut(A.p(t, 18.7, 19.8))));
    A.$("#hpath").style.fill = `color-mix(in srgb, var(--rose-deep) ${100 * A.p(t, 19.6, 20.0)}%, transparent)`;
    A.set("#e-heart", { o: 1, s: 1 + 0.06 * Math.sin(Math.max(0, t - 19.9) * 5) });
    const w = A.$("#e-word");
    w.style.clipPath = `inset(0 ${100 - 100 * A.inOut(A.p(t, 19.3, 20.4))}% 0 0)`;
    A.set(w, { o: 1 });
    A.set("#e-cta", { o: A.out(A.p(t, 20.2, 20.7)) });
    const u = A.back(A.p(t, 20.5, 21.1));
    const el = A.$("#e-pill");
    el.style.opacity = A.clamp(u * 2);
    el.style.visibility = u > 0 ? "visible" : "hidden";
    el.style.transform = `translateX(-50%) scale(${Math.max(0.01, u)})`;
    A.set("#e-small", { o: A.out(A.p(t, 21.0, 21.5)) });
  }
};
window.DURATION = DURATION;
</script>
</body>
</html>
